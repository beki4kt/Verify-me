name: Android production release

on:
  push:
    branches: ['release/**']
    paths:
      - android/**
      - lib/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/android-release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/chekmi-upload.jks
          {
            echo 'storeFile=../chekmi-upload.jks'
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - name: Install packages
        run: flutter pub get
      - name: Build signed app bundle
        env:
          SUPABASE_URL: ${{ vars.CHEKMI_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CHEKMI_SUPABASE_PUBLISHABLE_KEY }}
        run: >-
          flutter build appbundle --release
          --build-number=${{ github.run_number }}
          --dart-define=CHEKMI_ENV=production
          --dart-define=CHEKMI_SUPABASE_URL="$SUPABASE_URL"
          --dart-define=CHEKMI_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          --dart-define=CHEKMI_VERIFICATION_URL=https://lpbdxtzyzlaioggefscc.supabase.co/functions/v1/chekmi-verify
          --dart-define=CHEKMI_ALLOWED_VERIFIER_HOSTS=lpbdxtzyzlaioggefscc.supabase.co
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: chekmi-android-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
