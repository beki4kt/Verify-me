name: iPhone IPA for AltStore — Mesob relay pilot

on:
  workflow_dispatch:
  push:
    branches: ['build/iphone-altstore-*']

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Show Apple toolchain
        run: xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Install Flutter packages
        run: flutter pub get
      - name: Confirm Mesob pilot build key
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CHEKMI_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_PUBLISHABLE_KEY"
      - name: Probe self-hosted verifier from macOS runner
        continue-on-error: true
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --connect-timeout 8 --max-time 20 \
            https://api.chekmiverifier.com.et/health \
            | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{if(JSON.parse(s).status!=="ok")process.exit(1)})'
          curl --fail --silent --show-error --retry 2 --connect-timeout 8 --max-time 20 \
            https://api.chekmiverifier.com.et/ready \
            | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{const x=JSON.parse(s);if(x.status!=="ready"||x.verifierMode!=="live"||x.verifier?.engine!=="owned")process.exit(1);console.log(`Node verifier: ${x.verifier.engine}/${x.verifier.mode}`)})'
      - name: Test the compiled verification route
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CHEKMI_SUPABASE_PUBLISHABLE_KEY }}
        run: >-
          flutter test test/app_environment_test.dart
          --dart-define=CHEKMI_ENV=production
          --dart-define=CHEKMI_RELAY_PILOT=true
          --dart-define=VERIFY_ME_API_URL=https://api.chekmiverifier.com.et/api
          --dart-define=CHEKMI_SUPABASE_URL=https://lpbdxtzyzlaioggefscc.supabase.co
          --dart-define=CHEKMI_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
      - name: Build native release for physical iPhone
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CHEKMI_SUPABASE_PUBLISHABLE_KEY }}
        run: >-
          flutter build ios --release --no-codesign
          --build-number=${{ github.run_number }}
          --dart-define=CHEKMI_ENV=production
          --dart-define=CHEKMI_TEST2=true
          --dart-define=VERIFY_ME_API_URL=https://api.chekmiverifier.com.et/api
          --dart-define=CHEKMI_SUPABASE_URL=https://lpbdxtzyzlaioggefscc.supabase.co
          --dart-define=CHEKMI_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
      - name: Package unsigned IPA for AltStore signing
        shell: bash
        run: |
          set -euo pipefail
          APP=build/ios/iphoneos/Runner.app
          test -f "$APP/Runner"
          file "$APP/Runner" | grep arm64
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$APP/Info.plist"
          mkdir -p build/altstore/Payload
          ditto "$APP" build/altstore/Payload/Runner.app
          cd build/altstore
          /usr/bin/zip -qry Chekmi-iPhone.ipa Payload
          shasum -a 256 Chekmi-iPhone.ipa > Chekmi-iPhone.ipa.sha256
          printf 'Source commit: %s\nBuild: %s\nEnvironment: production Supabase project, Mesob pilot UI\nVerification endpoint: https://api.chekmiverifier.com.et/api/verify-and-create\nNo Supabase Edge verification URL is compiled into this build.\nUnsigned release IPA: install using AltStore to sign with your Apple account.\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" > BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Chekmi-iPhone-AltStore
          path: |
            build/altstore/Chekmi-iPhone.ipa
            build/altstore/Chekmi-iPhone.ipa.sha256
            build/altstore/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 7
