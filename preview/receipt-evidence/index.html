<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1020">
  <title>Chekmi · Receipt evidence preview</title>
  <style>
    :root{color-scheme:dark;--navy:#0B1020;--surface:#1A1F3D;--blue:#2F8CFF;--orange:#FF8A00;--white:#F4F7FF;--muted:#A4AEC7;--line:#303B5A;--green:#59DBA8}
    *{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#080D1B;color:var(--white);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #87BBFF;outline-offset:3px}.search{width:100%;height:42px;margin:0 0 13px;padding:0 13px;color:var(--white);background:#141B32;border:1px solid var(--line);border-radius:11px;font-size:13px}.search::placeholder{color:var(--muted)}
    .page{min-height:100vh;display:grid;place-items:center;padding:24px}.phone{width:min(100%,430px);min-height:min(860px,calc(100dvh - 48px));background:var(--navy);border:1px solid #2A3554;border-radius:30px;box-shadow:0 20px 85px #0008;overflow:hidden;display:flex;flex-direction:column}.top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #26314A}.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.03em;font-size:18px}.brand img{width:30px;height:30px;object-fit:contain}.badge{font-size:11px;padding:6px 9px;border-radius:20px;color:#FFD398;background:#422D18}.content{padding:25px 22px 28px;flex:1;overflow:auto}.back{border:0;background:transparent;color:var(--muted);padding:0 0 20px;display:flex;align-items:center;gap:6px;font-size:14px}.title{margin:0;font-size:26px;letter-spacing:-.045em;font-weight:750}.sub{margin:7px 0 24px;color:var(--muted);font-size:13px;line-height:1.4}.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.toolbar span{font-size:13px;color:var(--muted)}.row{border:1px solid var(--line);background:var(--surface);border-radius:15px;padding:17px;text-align:left;color:inherit;width:100%;display:flex;gap:13px;align-items:center;margin:10px 0;transition:border-color .15s,background .15s}.row:hover{border-color:#4F76A9;background:#1E2848}.icon{width:38px;height:38px;border-radius:12px;background:#243D6A;display:grid;place-items:center;color:#79B6FF;flex:none}.rowmain{flex:1;min-width:0}.amount{display:block;font-size:19px;font-weight:760;letter-spacing:-.025em}.meta{display:block;color:var(--muted);font-size:12px;margin-top:4px}.chevron{font-size:20px;color:var(--muted)}.money{font-size:40px;letter-spacing:-.055em;font-weight:760;margin:8px 0 0}.positive{color:var(--green)}.label{font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--green)}.completion{color:var(--muted);font-size:13px;margin:5px 0 23px}.panel{border-radius:16px;background:var(--surface);border:1px solid #303A59;padding:8px 16px}.data{display:flex;justify-content:space-between;gap:18px;padding:12px 0;border-bottom:1px solid #303A59;font-size:13px}.data:last-child{border:0}.data span:first-child{color:var(--muted)}.data span:last-child{text-align:right;font-weight:600;max-width:62%;overflow-wrap:anywhere}.section{font-size:17px;margin:26px 0 12px;font-weight:700;letter-spacing:-.02em}.empty{padding:23px 17px;border:1px dashed #4B5C7B;border-radius:15px;color:var(--muted);line-height:1.45;font-size:13px}.previewimg{width:100%;height:216px;object-fit:contain;background:#161B2C;border-radius:14px;border:1px solid var(--line);cursor:zoom-in}.actions{display:flex;gap:8px;margin-top:12px}.button{border-radius:12px;border:1px solid #40516F;color:var(--white);background:var(--surface);height:45px;padding:0 15px;font-size:13px;font-weight:650;min-width:0}.button.primary{background:linear-gradient(130deg,#2378E9,#3895FF);border-color:#4D9EFF}.button:active{transform:scale(.985)}.button:disabled{opacity:.5;cursor:wait}.notice{font-size:12px;color:#FFC984;margin:9px 0}.footer{border-top:1px solid #26314A;padding:14px 22px 18px;color:#7887A5;font-size:11px;line-height:1.5}.modal{position:fixed;inset:0;background:#050916ed;display:none;align-items:center;justify-content:center;padding:20px;z-index:3}.modal.open{display:flex}.modal img{max-width:min(95vw,900px);max-height:82vh;object-fit:contain}.close{position:absolute;right:20px;top:20px;background:var(--surface);color:white;border:1px solid var(--line);border-radius:11px;padding:9px 12px}.sample{color:#FFB563;font-weight:650;font-size:12px;margin:0 0 10px}@media(max-width:500px){.page{padding:0}.phone{width:100%;min-height:100dvh;border:0;border-radius:0}.content{padding-top:24px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <div class="page"><main class="phone" aria-label="Chekmi receipt evidence demonstration">
    <header class="top"><div class="brand"><img src="../../assets/branding/chekmi_mark_256.png" alt=""><span>chekmi</span></div><span class="badge">Illustrative preview</span></header>
    <div class="content" id="app"></div>
    <footer class="footer">Preview only · No bank lookup or production upload. A chosen image stays in this browser's local storage.</footer>
  </main></div>
  <div class="modal" id="modal" role="dialog" aria-label="Original image viewer" aria-modal="true"><button class="close" id="close">Close</button><img id="full" alt="Imported original receipt"></div>
  <input id="photo" type="file" accept="image/jpeg,image/png" hidden>
  <script src="app.js"></script>
</body>
</html>
